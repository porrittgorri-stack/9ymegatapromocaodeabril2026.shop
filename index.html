<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Feirão</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at top,#1e3a8a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

/* CONTAINER */

.container{
width:100%;
max-width:420px;
padding:20px;
}

/* CARD GLASS */

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:24px;
padding:30px;
box-shadow:0 30px 100px rgba(0,0,0,0.9);
text-align:center;
border:1px solid rgba(59,130,246,0.3);
}

/* BADGE */

.badge{
background:linear-gradient(90deg,#3b82f6,#06b6d4);
padding:8px 18px;
border-radius:50px;
font-size:12px;
font-weight:bold;
display:inline-block;
margin-bottom:15px;
box-shadow:0 0 20px rgba(59,130,246,0.8);
}

/* TITULO */

.brand{
font-size:38px;
font-weight:900;
background:linear-gradient(90deg,#60a5fa,#22d3ee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

/* SUB */

.subtitle{
font-size:14px;
color:#cbd5f5;
margin-bottom:20px;
}

/* PREÇO */

.price-box{
background:rgba(0,0,0,0.6);
border-radius:16px;
padding:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,0.08);
}

.old{
text-decoration:line-through;
color:#94a3b8;
font-size:14px;
}

.new{
font-size:48px;
font-weight:900;
color:#22d3ee;
margin-top:5px;
text-shadow:0 0 20px rgba(34,211,238,0.8);
}

/* LISTA */

.list{
text-align:left;
margin-bottom:25px;
}

.list div{
margin-bottom:10px;
font-size:14px;
}

/* BOTÃO NEON */

.cta{
display:block;
background:linear-gradient(90deg,#06b6d4,#3b82f6);
padding:18px;
border-radius:14px;
font-size:20px;
font-weight:900;
text-decoration:none;
color:white;
box-shadow:0 0 30px rgba(6,182,212,0.9);
transition:0.3s;
}

.cta:hover{
transform:scale(1.07);
box-shadow:0 0 50px rgba(6,182,212,1);
}

/* ALERTA */

.timer{
background:rgba(59,130,246,0.1);
color:#93c5fd;
padding:12px;
border-radius:10px;
font-size:13px;
margin-top:15px;
font-weight:bold;
}

/* FOOTER */

.footer{
text-align:center;
font-size:12px;
color:#64748b;
margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="badge">⚡ ACESSO EXCLUSIVO</div>

<div class="brand">MEGA FEIRÃO</div>

<div class="subtitle">
Oferta liberada por tempo limitado
</div>

<div class="price-box">
<div class="old">De R$ 7.865,00</div>
<div class="new">R$ 79,97</div>
</div>

<div class="list">
<div>✔ Desconto especial ativado</div>
<div>✔ Liberação imediata</div>
<div>✔ Suporte prioritário</div>
</div>

<a class="cta" href="https://stutzmanpankey-oss.github.io/megapromocoesmesdeabril2026/inicio/">
⚡ ACESSAR DESCONTO →
</a>

<div class="timer">
⏳ Promoção pode encerrar a qualquer momento
</div>

<div class="footer">
🔒 Ambiente seguro • Transação protegida
</div>

</div>

</div>

</body>
</html>
